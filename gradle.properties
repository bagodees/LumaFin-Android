
# "LumaFin <version> dev debug". Bump it right after publishing a release.
# Exact public version required when packaging the next Google Play release.
# Increase for each Play upload, including test builds with the same public version.

# Gradle
org.gradle.jvmargs=-Xmx2048m

# Allow switching between flavors of the Jellyfin SDK. Possible values are:
# - "default"
# - "local" (local Maven repository)
# - "snapshot" (SDK master)
# - "unstable-snapshot" (SDK with unstable Jellyfin API)
sdk.version=default
